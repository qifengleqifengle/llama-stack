<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG 工作台</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-rail">
        <div class="rail-brand">
          <div class="rail-logo">R</div>
        </div>
        <nav class="rail-nav" aria-label="主导航">
          <button class="tab-button active" data-tab="knowledge" title="知识库">
            <span class="rail-icon">KB</span>
            <span class="rail-text">知识库</span>
          </button>
          <button class="tab-button" data-tab="chat" title="对话">
            <span class="rail-icon">AI</span>
            <span class="rail-text">对话</span>
          </button>
        </nav>
      </aside>

      <main class="app-main">
        <header class="topbar">
          <div class="topbar-title">
            <h1>知识库工作台</h1>
          </div>
          <div class="topbar-actions">
            <div class="context-chip">
              <strong id="current-kb-label">尚未选择</strong>
            </div>
          </div>
        </header>

        <section id="tab-knowledge" class="tab-panel active">
          <div class="workspace-layout">
            <aside class="workspace-sidebar">
              <div class="panel section-panel">
                <div class="panel-header">
                  <div>
                    <h2>知识库</h2>
                  </div>
                  <button id="open-kb-modal" class="primary-button" type="button">新建</button>
                </div>
                <div id="kb-list" class="stack-list"></div>
              </div>
            </aside>

            <section class="workspace-content">
              <div class="panel content-panel">
                <div class="panel-header">
                  <div>
                    <h2>当前知识库内容</h2>
                  </div>
                  <button id="open-upload-modal" class="primary-button" type="button">导入文件</button>
                </div>
                <div id="knowledge-document-list" class="stack-list document-stack"></div>
              </div>
            </section>
          </div>
        </section>

        <section id="tab-chat" class="tab-panel">
          <div class="chat-layout">
            <aside class="chat-sidebar">
              <div class="panel section-panel">
                <div class="panel-header">
                  <div>
                    <h2>对话设置</h2>
                  </div>
                  <button id="new-chat-session" class="ghost-button" type="button">新对话</button>
                </div>
                <div class="form-card compact-form">
                  <label>
                    选择知识库
                    <select id="chat-kb-select"></select>
                  </label>
                  <label>
                    对话模型
                    <select id="chat-model"></select>
                  </label>
                  <label>
                    系统指令
                    <textarea id="chat-instructions" rows="4">你是一个基于检索结果作答的助手。请优先使用检索出的知识片段，回答要简洁，并准确引用已命中的内容。</textarea>
                  </label>
                  <div class="form-grid form-grid-2">
                    <label>
                      模式
                      <select id="chat-mode">
                        <option value="hybrid">hybrid</option>
                        <option value="vector">vector</option>
                        <option value="keyword">keyword</option>
                      </select>
                    </label>
                    <label>
                      返回片段
                      <input id="chat-max-chunks" type="number" min="1" max="20" value="5" />
                    </label>
                  </div>
                  <div class="form-grid form-grid-3">
                    <label>
                      重排
                      <select id="chat-ranker">
                        <option value="rrf">rrf</option>
                        <option value="weighted">weighted</option>
                      </select>
                    </label>
                    <label>
                      Alpha
                      <input id="chat-alpha" type="number" min="0" max="1" step="0.05" value="0.6" />
                    </label>
                    <label>
                      Impact
                      <input id="chat-impact" type="number" min="1" step="1" value="60" />
                    </label>
                  </div>
                  <label class="toggle-field">
                    <input id="chat-query-rewrite" type="checkbox" />
                    <span>启用查询改写</span>
                  </label>
                </div>
              </div>
            </aside>

            <section class="chat-main">
              <div class="panel chat-panel-shell">
                <div class="panel-header">
                  <div>
                    <h2>引用式对话</h2>
                  </div>
                </div>
                <div class="chat-panel">
                  <div id="chat-transcript" class="chat-transcript"></div>
                  <form id="chat-message-form" class="chat-composer">
                    <textarea id="chat-message" rows="4" placeholder="输入一个基于当前知识库的问题"></textarea>
                    <div class="form-actions">
                      <button type="submit" class="primary-button">发送问题</button>
                    </div>
                  </form>
                </div>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div id="chunk-modal" class="modal hidden" aria-hidden="true">
      <div id="chunk-modal-backdrop" class="modal-backdrop"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="chunk-modal-title">
        <div class="modal-header">
          <div>
            <h2 id="chunk-modal-title">查看切块结果</h2>
          </div>
          <button id="chunk-modal-close" class="ghost-button" type="button">关闭</button>
        </div>
        <div id="chunk-modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="kb-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="kb-modal"></div>
      <div class="modal-dialog modal-dialog-narrow" role="dialog" aria-modal="true" aria-labelledby="kb-modal-title">
        <div class="modal-header">
          <div>
            <h2 id="kb-modal-title">新建知识库</h2>
          </div>
          <button class="ghost-button" type="button" data-close-modal="kb-modal">关闭</button>
        </div>
        <form id="kb-form" class="form-card compact-form">
          <label>
            知识库名称
            <input id="kb-name" name="name" placeholder="例如：产品知识库" required />
          </label>
          <label>
            向量库 ID
            <input id="kb-id" name="vector_db_id" placeholder="可选，不填自动生成" />
          </label>
          <label>
            向量模型
            <select id="kb-embedding-model" name="embedding_model"></select>
          </label>
          <div class="form-actions">
            <button type="submit" class="primary-button">创建知识库</button>
          </div>
        </form>
      </div>
    </div>

    <div id="upload-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="upload-modal"></div>
      <div class="modal-dialog modal-dialog-narrow" role="dialog" aria-modal="true" aria-labelledby="upload-modal-title">
        <div class="modal-header">
          <div>
            <h2 id="upload-modal-title">导入文件</h2>
          </div>
          <button class="ghost-button" type="button" data-close-modal="upload-modal">关闭</button>
        </div>
        <form id="upload-doc-form" class="form-card compact-form">
          <div class="file-picker">
            <button id="upload-doc-trigger" type="button" class="ghost-button">选择文件</button>
            <input id="upload-doc-files" type="file" multiple />
            <div id="upload-doc-selection" class="document-meta">尚未选择文件</div>
          </div>
          <label>
            分块策略
            <select id="upload-doc-strategy">
              <option value="mineru_markdown">MinerU 结构分块</option>
              <option value="fixed_tokens">固定长度分块</option>
              <option value="fixed_chars">固定字符分块</option>
              <option value="recursive">递归分块</option>
            </select>
          </label>
          <label id="upload-doc-token-size-group">
            分块大小
            <input id="upload-doc-chunk-size" type="number" min="64" max="4096" value="512" />
          </label>
          <label id="upload-doc-char-size-group" class="hidden">
            字符长度
            <input id="upload-doc-char-size" type="number" min="200" max="12000" value="1200" />
          </label>
          <div class="form-actions">
            <button type="submit" class="primary-button">解析并导入文件</button>
          </div>
        </form>
      </div>
    </div>

    <div id="status-modal" class="status-modal hidden" aria-hidden="true">
      <div class="status-modal-card">
        <div id="status-modal-message" class="status-modal-message"></div>
      </div>
    </div>

    <div id="confirm-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-dialog modal-dialog-narrow" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <div class="modal-header">
          <div>
            <h2 id="confirm-modal-title">确认操作</h2>
          </div>
        </div>
        <div class="confirm-copy" id="confirm-modal-message">确认继续？</div>
        <div class="form-actions">
          <button id="confirm-modal-cancel" class="ghost-button" type="button">取消</button>
          <button id="confirm-modal-ok" class="primary-button" type="button">确认</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
